<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>صائد النجوم</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#111827,#312e81);color:#fff;min-height:100vh;overflow:hidden;touch-action:none}
.game{width:100%;height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.panel{width:min(100%,900px);height:min(96vh,700px);position:relative;background:rgba(17,24,39,.72);border:2px solid rgba(255,255,255,.15);border-radius:28px;overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.4);backdrop-filter:blur(10px)}
canvas{width:100%;height:100%;display:block}
.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;z-index:2;pointer-events:none}
.badge{background:rgba(0,0,0,.45);padding:10px 14px;border-radius:16px;font-weight:bold;font-size:clamp(14px,2.4vw,20px);border:1px solid rgba(255,255,255,.12)}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,10,25,.72);z-index:3}
.card{width:min(88%,500px);text-align:center;background:linear-gradient(180deg,#1e293b,#111827);padding:30px;border-radius:28px;border:1px solid rgba(255,255,255,.15);box-shadow:0 20px 60px rgba(0,0,0,.45)}
h1{font-size:clamp(32px,7vw,58px);margin-bottom:10px}
p{font-size:clamp(15px,3vw,20px);line-height:1.7;color:#cbd5e1;margin-bottom:20px}
button{border:0;border-radius:16px;padding:14px 28px;font-size:18px;font-weight:bold;color:#fff;background:linear-gradient(135deg,#8b5cf6,#ec4899);cursor:pointer;box-shadow:0 10px 25px rgba(236,72,153,.25)}
button:active{transform:scale(.96)}
.tip{margin-top:14px;font-size:13px;color:#94a3b8}
@media(max-width:600px){.panel{height:100vh;border-radius:0}.game{padding:0}.hud{top:8px;left:8px;right:8px}.badge{padding:8px 10px}.card{padding:24px}}
</style>
</head>
<body>
<div class="game"><div class="panel">
<canvas id="game"></canvas>
<div class="hud">
  <div class="badge">⭐ النقاط: <span id="score">0</span></div>
  <div class="badge">❤️ الأرواح: <span id="lives">3</span></div>
</div>
<div class="overlay" id="start">
  <div class="card">
    <h1>🌟 صائد النجوم</h1>
    <p>حرّك السلة واجمع النجوم الذهبية وتجنب القنابل. اللعبة تعمل باللمس والماوس ولوحة المفاتيح.</p>
    <button id="startBtn">ابدأ اللعب</button>
    <div class="tip">على الهاتف: اسحب إصبعك يمينًا ويسارًا لتحريك السلة.</div>
  </div>
</div>
<div class="overlay" id="gameover" style="display:none">
  <div class="card">
    <h1>انتهت اللعبة</h1>
    <p>نتيجتك: <b id="finalScore">0</b> نقطة</p>
    <button id="restartBtn">العب مرة أخرى</button>
  </div>
</div>
</div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'), livesEl=document.getElementById('lives');
let W,H,score=0,lives=3,running=false,last=0,spawn=0,items=[],stars=[],keys={};
const player={x:0,y:0,w:90,h:25,targetX:0};

function resize(){
  const r=canvas.getBoundingClientRect(), d=Math.min(devicePixelRatio||1,2);
  W=r.width; H=r.height; canvas.width=W*d; canvas.height=H*d; ctx.setTransform(d,0,0,d,0,0);
  player.y=H-65; player.x=player.targetX=player.x||W/2;
  stars=Array.from({length:Math.max(30,Math.floor(W/12))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.4,s:Math.random()*.8+.2}));
}
addEventListener('resize',resize); resize();

function spawnItem(){
  const bomb=Math.random()<.22;
  items.push({x:30+Math.random()*(W-60),y:-30,size:18+Math.random()*10,speed:120+Math.random()*100+(score*.5),bomb,rot:0});
}
function reset(){
 score=0;lives=3;items=[];scoreEl.textContent=0;livesEl.textContent=3;running=true;
 document.getElementById('start').style.display='none';document.getElementById('gameover').style.display='none';
 player.x=player.targetX=W/2; last=performance.now();requestAnimationFrame(loop);
}
function endGame(){
 running=false;document.getElementById('finalScore').textContent=score;
 document.getElementById('gameover').style.display='flex';
}
function hit(a,b){return Math.abs(a.x-b.x)<(a.size+b.w/2) && Math.abs(a.y-(b.y+b.h/2))<(a.size+b.h/2)}
function drawStar(x,y,r,fill){
 ctx.save();ctx.translate(x,y);ctx.beginPath();
 for(let i=0;i<10;i++){let rr=i%2?r:r*.45, a=-Math.PI/2+i*Math.PI/5;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}
 ctx.closePath();ctx.fillStyle=fill;ctx.shadowBlur=14;ctx.shadowColor=fill;ctx.fill();ctx.restore();
}
function drawBomb(x,y,r){
 ctx.save();ctx.translate(x,y);ctx.fillStyle='#ef4444';ctx.shadowBlur=12;ctx.shadowColor='#ef4444';
 ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111827';ctx.beginPath();ctx.arc(-r*.3,-r*.15,r*.15,0,7);ctx.arc(r*.3,-r*.15,r*.15,0,7);ctx.fill();
 ctx.strokeStyle='#f59e0b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(r*.5,-r*.7);ctx.quadraticCurveTo(r*1.2,-r*1.2,r*1.15,-r*1.7);ctx.stroke();ctx.restore();
}
function draw(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f172a');g.addColorStop(1,'#312e81');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 stars.forEach(s=>{ctx.globalAlpha=.35+s.s*.5;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()});ctx.globalAlpha=1;
 items.forEach(o=>o.bomb?drawBomb(o.x,o.y,o.size):drawStar(o.x,o.y,o.size,'#facc15'));
 // basket
 ctx.save();ctx.translate(player.x,player.y);ctx.fillStyle='#38bdf8';ctx.shadowBlur=18;ctx.shadowColor='#38bdf8';
 ctx.beginPath();ctx.roundRect(-player.w/2,0,player.w,player.h,10);ctx.fill();
 ctx.strokeStyle='#e0f2fe';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,3,player.w*.42,Math.PI,0);ctx.stroke();ctx.restore();
}
function loop(t){
 if(!running)return; const dt=Math.min((t-last)/1000,.03);last=t;
 if(keys.ArrowLeft||keys.a)player.targetX-=420*dt;if(keys.ArrowRight||keys.d)player.targetX+=420*dt;
 player.targetX=Math.max(player.w/2,Math.min(W-player.w/2,player.targetX));
 player.x+=(player.targetX-player.x)*Math.min(1,dt*14);
 spawn+=dt;if(spawn>.55){spawn=0;spawnItem()}
 items.forEach(o=>{o.y+=o.speed*dt;o.rot+=dt*4});
 for(let i=items.length-1;i>=0;i--){let o=items[i];
   if(hit(o,player)){if(o.bomb){lives--;livesEl.textContent=lives;if(lives<=0){items.splice(i,1);draw();endGame();return}}
   else{score+=10;scoreEl.textContent=score}items.splice(i,1)}
   else if(o.y>H+50)items.splice(i,1);
 }
 draw();requestAnimationFrame(loop);
}
addEventListener('keydown',e=>{keys[e.key]=true});addEventListener('keyup',e=>{keys[e.key]=false});
function move(e){const r=canvas.getBoundingClientRect(), x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;player.targetX=x}
canvas.addEventListener('pointermove',e=>{if(e.buttons)move(e)});canvas.addEventListener('pointerdown',move);
canvas.addEventListener('touchmove',e=>{e.preventDefault();move(e)},{passive:false});
document.getElementById('startBtn').onclick=reset;document.getElementById('restartBtn').onclick=reset;
</script>
</body>
</html>
